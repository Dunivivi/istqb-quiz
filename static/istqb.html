<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISTQB Quiz</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f0f4f8;
            --surface: #ffffff;
            --sidebar-bg: #1e293b;
            --sidebar-text: #cbd5e1;
            --sidebar-active: #3b82f6;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --correct: #16a34a;
            --correct-bg: #dcfce7;
            --incorrect: #dc2626;
            --incorrect-bg: #fee2e2;
            --selected-bg: #dbeafe;
            --selected-border: #3b82f6;
            --btn: #3b82f6;
            --btn-hover: #2563eb;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --sidebar-bg: #0f172a;
            --sidebar-text: #94a3b8;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
            --correct-bg: #14532d;
            --incorrect-bg: #7f1d1d;
            --selected-bg: #1e3a5f;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        .sidebar { width: 280px; min-width: 280px; background: var(--sidebar-bg); display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid #334155; }
        .sidebar-header h1 { color: #f1f5f9; font-size: 18px; font-weight: 700; }
        .sidebar-header p { color: #64748b; font-size: 12px; margin-top: 2px; }

        .search-box { padding: 12px 16px; }
        .search-box input { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f1f5f9; font-size: 13px; outline: none; }
        .search-box input:focus { border-color: var(--sidebar-active); }
        .search-box input::placeholder { color: #475569; }

        .modules-list { flex: 1; overflow-y: auto; padding: 8px 0; }
        .module-btn { width: 100%; padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: none; background: none; color: var(--sidebar-text); font-size: 13px; text-align: left; transition: background 0.15s; }
        .module-btn:hover { background: #334155; }
        .module-btn.active { background: #1e3a5f; color: #93c5fd; }
        .module-btn .module-name { font-weight: 500; }
        .module-btn .module-count { background: #334155; color: #94a3b8; padding: 2px 7px; border-radius: 10px; font-size: 11px; }
        .module-btn.active .module-count { background: #1d4ed8; color: #bfdbfe; }

        .sidebar-footer { padding: 12px 16px; border-top: 1px solid #334155; }
        .score-display { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
        .score-item { text-align: center; padding: 6px; border-radius: 8px; background: #0f172a; }
        .score-item .val { font-size: 18px; font-weight: 700; }
        .score-item .lbl { font-size: 10px; color: #64748b; margin-top: 1px; }
        .score-item.correct .val { color: #4ade80; }
        .score-item.incorrect .val { color: #f87171; }
        .score-item.remaining .val { color: #94a3b8; }

        /* MAIN */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .topbar { padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .topbar-left { display: flex; align-items: center; gap: 8px; flex: 1; }
        .current-module { font-weight: 600; font-size: 15px; color: var(--text); }
        .question-counter { color: var(--text-muted); font-size: 13px; }

        .topbar-right { display: flex; align-items: center; gap: 8px; }
        .jump-input { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px; width: 80px; outline: none; }
        .jump-input:focus { border-color: var(--btn); }

        .btn { padding: 7px 14px; border-radius: 8px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
        .btn-primary { background: var(--btn); color: white; }
        .btn-primary:hover { background: var(--btn-hover); }
        .btn-ghost { background: var(--bg); color: var(--text-muted); border: 1px solid var(--border); }
        .btn-ghost:hover { background: var(--border); }
        .btn-ghost.active { background: var(--btn); color: white; border-color: var(--btn); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* QUIZ AREA */
        .quiz-area { flex: 1; overflow-y: auto; padding: 32px 24px; }

        .empty-state { text-align: center; padding: 80px 24px; color: var(--text-muted); }
        .empty-state h2 { font-size: 20px; margin-bottom: 8px; }

        .question-card { max-width: 780px; margin: 0 auto; }
        .question-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; display: flex; gap: 12px; }
        .badge { padding: 2px 8px; border-radius: 10px; background: var(--border); font-size: 11px; font-weight: 500; }

        .question-text { font-size: 17px; line-height: 1.65; color: var(--text); margin-bottom: 28px; white-space: pre-wrap; }

        .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
        .option { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--border); cursor: pointer; transition: all 0.15s; background: var(--surface); }
        .option:hover:not(.disabled) { border-color: var(--selected-border); background: var(--selected-bg); }
        .option.selected { border-color: var(--selected-border); background: var(--selected-bg); }
        .option.correct { border-color: var(--correct); background: var(--correct-bg); }
        .option.incorrect { border-color: var(--incorrect); background: var(--incorrect-bg); }
        .option.disabled { cursor: default; }
        .option-letter { width: 30px; height: 30px; min-width: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; border: 2px solid var(--border); color: var(--text-muted); }
        .option.selected .option-letter { border-color: var(--selected-border); color: var(--selected-border); }
        .option.correct .option-letter { border-color: var(--correct); color: var(--correct); }
        .option.incorrect .option-letter { border-color: var(--incorrect); color: var(--incorrect); }
        .option-text { font-size: 15px; line-height: 1.5; padding-top: 3px; }

        .result-banner { padding: 14px 18px; border-radius: 12px; margin-bottom: 20px; font-weight: 600; font-size: 15px; display: none; }
        .result-banner.correct { background: var(--correct-bg); color: var(--correct); display: block; }
        .result-banner.incorrect { background: var(--incorrect-bg); color: var(--incorrect); display: block; }

        .discussions { margin-top: 20px; }
        .discussions h4 { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
        .discussion-item { padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; }
        .discussion-item .d-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .discussion-item .d-user { font-size: 12px; font-weight: 600; color: var(--btn); }
        .discussion-item .d-selected-answer { font-size: 11px; background: var(--border); padding: 1px 7px; border-radius: 10px; color: var(--text-muted); }
        .discussion-item .d-selected-answer strong { color: var(--text); }
        .discussion-item .d-timestamp { font-size: 11px; color: var(--text-muted); margin-left: auto; }
        .discussion-item .d-comment { font-size: 13px; line-height: 1.5; color: var(--text); }
        .discussion-item .d-votes { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

        /* NAV BAR */
        .nav-bar { padding: 12px 24px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .nav-bar-left { display: flex; gap: 8px; }
        .progress-bar { flex: 1; margin: 0 20px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--btn); border-radius: 3px; transition: width 0.3s; }

        /* SEARCH RESULTS */
        .search-results { padding: 8px 16px; }
        .search-result-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--sidebar-text); line-height: 1.4; }
        .search-result-item:hover { background: #334155; }
        .search-result-item .r-meta { color: #64748b; font-size: 11px; }
        .search-result-item mark { background: #854d0e; color: #fef08a; border-radius: 2px; padding: 0 2px; }
        .search-panel { display: none; flex-direction: column; overflow: hidden; flex: 1; }
        .search-panel.visible { display: flex; }
        .modules-panel { display: flex; flex-direction: column; overflow: hidden; flex: 1; }
        .modules-panel.hidden { display: none; }

        @media (max-width: 600px) {
            .sidebar { width: 220px; min-width: 220px; }
            .quiz-area { padding: 20px 14px; }
        }
    </style>
</head>
<body data-theme="light">

<aside class="sidebar">
    <div class="sidebar-header">
        <h1>ISTQB Quiz</h1>
        <p>Exam preparation</p>
    </div>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="Search questions..." autocomplete="off">
    </div>

    <div class="modules-panel" id="modules-panel">
        <div class="modules-list" id="modules-list"></div>
    </div>

    <div class="search-panel" id="search-panel">
        <div class="modules-list search-results" id="search-results"></div>
    </div>

    <div class="sidebar-footer">
        <div class="score-display">
            <div class="score-item correct"><div class="val" id="score-correct">0</div><div class="lbl">Correct</div></div>
            <div class="score-item incorrect"><div class="val" id="score-incorrect">0</div><div class="lbl">Wrong</div></div>
            <div class="score-item remaining"><div class="val" id="score-remaining">0</div><div class="lbl">Left</div></div>
        </div>
    </div>
</aside>

<div class="main">
    <div class="topbar">
        <div class="topbar-left">
            <span class="current-module" id="current-module">Select a module</span>
            <span class="question-counter" id="question-counter"></span>
        </div>
        <div class="topbar-right">
            <button class="btn btn-ghost" id="shuffle-btn" title="Shuffle questions">⇄ Shuffle</button>
            <button class="btn btn-ghost" id="reset-btn" title="Reset score">↺ Reset</button>
            <input type="number" class="jump-input" id="jump-input" placeholder="Go to #" min="1">
            <button class="btn btn-ghost" id="theme-btn">🌙</button>
        </div>
    </div>

    <div class="quiz-area" id="quiz-area">
        <div class="empty-state">
            <h2>Select a module to start</h2>
            <p>Choose an ISTQB exam module from the sidebar</p>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-bar-left">
            <button class="btn btn-ghost" id="prev-btn" disabled>← Prev</button>
            <button class="btn btn-ghost" id="next-btn" disabled>Next →</button>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
        <button class="btn btn-ghost" id="skip-btn" disabled>Skip →</button>
    </div>
</div>

<script>
const API = '/api';
let allQuestions = [];
let currentQuestions = [];
let currentIndex = 0;
let answered = {};   // id -> { selected, correct }
let shuffled = false;

// ── Load modules ─────────────────────────────────────────────────────────────
async function loadModules() {
    const res = await fetch(API + '/istqb/modules');
    const data = await res.json();
    const list = document.getElementById('modules-list');
    list.innerHTML = data.modules.map(m =>
        `<button class="module-btn" data-module="${m.module}">
            <span class="module-name">${m.module}</span>
            <span class="module-count">${m.count}</span>
        </button>`
    ).join('') +
        `<button class="module-btn" data-module="__ALL__">
            <span class="module-name">All modules</span>
            <span class="module-count">${data.modules.reduce((a,m)=>a+m.count,0)}</span>
        </button>`;

    list.querySelectorAll('.module-btn').forEach(btn => {
        btn.addEventListener('click', () => selectModule(btn.dataset.module, btn));
    });
}

// ── Select module ─────────────────────────────────────────────────────────────
async function selectModule(module, btnEl) {
    document.querySelectorAll('.module-btn').forEach(b => b.classList.remove('active'));
    if (btnEl) btnEl.classList.add('active');

    const url = module === '__ALL__'
        ? API + '/istqb/questions'
        : API + '/istqb/questions?module=' + encodeURIComponent(module);

    const res = await fetch(url);
    const data = await res.json();
    allQuestions = data.questions;
    currentQuestions = [...allQuestions];
    if (shuffled) shuffle(currentQuestions);
    currentIndex = 0;
    answered = {};
    updateScore();

    document.getElementById('current-module').textContent = module === '__ALL__' ? 'All Modules' : module;
    document.getElementById('prev-btn').disabled = false;
    document.getElementById('next-btn').disabled = false;
    document.getElementById('skip-btn').disabled = false;
    document.getElementById('jump-input').max = currentQuestions.length;

    renderQuestion();
}

// ── Render question ───────────────────────────────────────────────────────────
function renderQuestion() {
    if (!currentQuestions.length) return;
    const q = currentQuestions[currentIndex];
    const ans = answered[q.id];

    updateCounter();

    const optionsHtml = q.options.map(opt => {
        let cls = 'option';
        if (ans) {
            cls += ' disabled';
            if (opt.letter === q.correct_answer) cls += ' correct';
            else if (opt.letter === ans.selected) cls += ' incorrect';
        }
        return `<div class="${cls}" data-letter="${opt.letter}">
            <div class="option-letter">${opt.letter}</div>
            <div class="option-text">${opt.text}</div>
        </div>`;
    }).join('');

    let resultHtml = '';
    if (ans) {
        if (ans.correct) {
            resultHtml = `<div class="result-banner correct">✓ Correct!</div>`;
        } else {
            resultHtml = `<div class="result-banner incorrect">✗ Wrong — correct answer is <strong>${q.correct_answer}</strong></div>`;
        }
    }

    let discussHtml = '';
    if (ans && q.discussions && q.discussions.length) {
        discussHtml = `<div class="discussions">
            <h4>Community discussions (${q.discussions.length})</h4>
            ${q.discussions.map(d => `
                <div class="discussion-item">
                    <div class="d-header">
                        <span class="d-user">${d.user}</span>
                        ${d.selected_answer ? `<span class="d-selected-answer">Selected: <strong>${d.selected_answer}</strong></span>` : ''}
                        ${d.timestamp ? `<span class="d-timestamp">${d.timestamp}</span>` : ''}
                    </div>
                    <div class="d-comment">${d.comment}</div>
                    ${d.votes ? `<div class="d-votes">▲ ${d.votes}</div>` : ''}
                </div>`).join('')}
        </div>`;
    }

    document.getElementById('quiz-area').innerHTML = `
        <div class="question-card">
            <div class="question-meta">
                <span class="badge">${q.module}</span>
                <span class="badge">Topic ${q.topic} · Q${q.number}</span>
            </div>
            <p class="question-text">${q.question}</p>
            ${resultHtml}
            <div class="options">${optionsHtml}</div>
            ${discussHtml}
        </div>`;

    if (!ans) {
        document.querySelectorAll('.option').forEach(el => {
            el.addEventListener('click', () => submitAnswer(q, el.dataset.letter));
        });
    }

    updateProgress();
    document.getElementById('quiz-area').scrollTop = 0;
}

function submitAnswer(q, selected) {
    const correct = selected === q.correct_answer;
    answered[q.id] = { selected, correct };
    updateScore();
    renderQuestion();
}

// ── Navigation ────────────────────────────────────────────────────────────────
function goTo(index) {
    if (index < 0 || index >= currentQuestions.length) return;
    currentIndex = index;
    renderQuestion();
}

document.getElementById('prev-btn').addEventListener('click', () => goTo(currentIndex - 1));
document.getElementById('next-btn').addEventListener('click', () => goTo(currentIndex + 1));
document.getElementById('skip-btn').addEventListener('click', () => {
    // Mark as skipped (no answer) and advance
    goTo(currentIndex + 1);
});

document.getElementById('jump-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        const val = parseInt(e.target.value);
        if (!isNaN(val)) { goTo(val - 1); e.target.value = ''; }
    }
});

document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(currentIndex + 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(currentIndex - 1);
    // 1-4 to select option
    const map = {'1':'A','2':'B','3':'C','4':'D'};
    if (map[e.key] && currentQuestions.length) {
        const q = currentQuestions[currentIndex];
        if (!answered[q.id]) {
            const opt = q.options.find(o => o.letter === map[e.key]);
            if (opt) submitAnswer(q, opt.letter);
        }
    }
});

// ── Shuffle ───────────────────────────────────────────────────────────────────
function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
}

document.getElementById('shuffle-btn').addEventListener('click', () => {
    shuffled = !shuffled;
    document.getElementById('shuffle-btn').classList.toggle('active', shuffled);
    if (currentQuestions.length) {
        currentQuestions = [...allQuestions];
        if (shuffled) shuffle(currentQuestions);
        currentIndex = 0;
        renderQuestion();
    }
});

// ── Reset ─────────────────────────────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click', () => {
    answered = {};
    currentIndex = 0;
    updateScore();
    if (currentQuestions.length) renderQuestion();
});

// ── Score ─────────────────────────────────────────────────────────────────────
function updateScore() {
    const vals = Object.values(answered);
    const correct = vals.filter(a => a.correct).length;
    const incorrect = vals.filter(a => !a.correct).length;
    const remaining = currentQuestions.length - vals.length;
    document.getElementById('score-correct').textContent = correct;
    document.getElementById('score-incorrect').textContent = incorrect;
    document.getElementById('score-remaining').textContent = remaining;
}

function updateCounter() {
    document.getElementById('question-counter').textContent =
        `${currentIndex + 1} / ${currentQuestions.length}`;
}

function updateProgress() {
    const pct = currentQuestions.length ? ((currentIndex + 1) / currentQuestions.length * 100) : 0;
    document.getElementById('progress-fill').style.width = pct + '%';
}

// ── Search ────────────────────────────────────────────────────────────────────
let searchTimeout;
document.getElementById('search-input').addEventListener('input', e => {
    clearTimeout(searchTimeout);
    const q = e.target.value.trim();
    if (!q) {
        document.getElementById('search-panel').classList.remove('visible');
        document.getElementById('modules-panel').classList.remove('hidden');
        return;
    }
    searchTimeout = setTimeout(() => doSearch(q), 250);
});

async function doSearch(query) {
    document.getElementById('search-panel').classList.add('visible');
    document.getElementById('modules-panel').classList.add('hidden');

    // Load all if not loaded
    if (!allQuestions.length) {
        const res = await fetch(API + '/istqb/questions');
        const data = await res.json();
        allQuestions = data.questions;
    }

    const lower = query.toLowerCase();
    const matches = allQuestions.filter(q =>
        q.question.toLowerCase().includes(lower) ||
        q.options.some(o => o.text.toLowerCase().includes(lower))
    ).slice(0, 30);

    const highlight = str => {
        const idx = str.toLowerCase().indexOf(lower);
        if (idx === -1) return str.substring(0, 80);
        const start = Math.max(0, idx - 30);
        const snippet = str.substring(start, start + 100);
        return snippet.replace(new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi'),
            m => `<mark>${m}</mark>`);
    };

    const container = document.getElementById('search-results');
    if (!matches.length) {
        container.innerHTML = '<p style="padding:12px 10px;color:#64748b;font-size:13px">No results</p>';
        return;
    }
    container.innerHTML = matches.map(q =>
        `<div class="search-result-item" data-id="${q.id}">
            <div>${highlight(q.question)}</div>
            <div class="r-meta">${q.module} · Topic ${q.topic} · Q${q.number}</div>
        </div>`
    ).join('');

    container.querySelectorAll('.search-result-item').forEach(el => {
        el.addEventListener('click', () => {
            const id = parseInt(el.dataset.id);
            // Find in current or switch to all
            let idx = currentQuestions.findIndex(q => q.id === id);
            if (idx === -1) {
                // Load all and jump
                currentQuestions = allQuestions;
                idx = currentQuestions.findIndex(q => q.id === id);
                document.getElementById('current-module').textContent = 'All Modules';
                document.querySelectorAll('.module-btn').forEach(b => b.classList.remove('active'));
                updateScore();
            }
            if (idx !== -1) {
                currentIndex = idx;
                renderQuestion();
            }
            document.getElementById('search-input').value = '';
            document.getElementById('search-panel').classList.remove('visible');
            document.getElementById('modules-panel').classList.remove('hidden');
        });
    });
}

// ── Theme ─────────────────────────────────────────────────────────────────────
document.getElementById('theme-btn').addEventListener('click', () => {
    const current = document.body.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    document.body.setAttribute('data-theme', next);
    document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('istqb-theme', next);
});

const savedTheme = localStorage.getItem('istqb-theme') || 'light';
document.body.setAttribute('data-theme', savedTheme);
document.getElementById('theme-btn').textContent = savedTheme === 'dark' ? '☀️' : '🌙';

// ── Init ──────────────────────────────────────────────────────────────────────
loadModules();
</script>
</body>
</html>
